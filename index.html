<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชาญวิทย์ฟาร์ม - บันทึกการประมูลกุ้ง</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  // ใช้โปรเจกต์ Firebase เดียวกับเว็บ Chanvit-Farm แต่เก็บใน collection "auctions" แยกต่างหาก
  firebase.initializeApp({
    apiKey: "AIzaSyC5frSLzd81k3vP5_U8jynww2hL2Cti-Og",
    authDomain: "chanvit-farm.firebaseapp.com",
    projectId: "chanvit-farm",
    storageBucket: "chanvit-farm.firebasestorage.app",
    messagingSenderId: "469335713777",
    appId: "1:469335713777:web:9b58a9c2cfb8c3f1314650"
  });
  const db = firebase.firestore();
</script>
<style>
  :root{
    --primary:#0f6e56; --primary-dark:#085041; --primary-light:#e1f5ee;
    --danger:#a32d2d; --danger-light:#fcebeb;
    --bg:#f6f7f5; --card:#ffffff; --border:#e2e5e1;
    --text:#1f2622; --text-secondary:#5f6b65;
    --brand:#e8632a; --brand-dark:#c84e1c; --brand-light:#fdeee6;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',-apple-system,'Sarabun',sans-serif;
    background:
      radial-gradient(1200px 400px at 100% -50px, rgba(232,99,42,0.05), transparent 60%),
      radial-gradient(1000px 360px at -10% 0, rgba(15,110,86,0.06), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); min-height:100vh; padding-bottom:60px;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:#fff; padding:12px 16px; display:flex; align-items:center; gap:11px;
    position:sticky; top:0; z-index:50;
    box-shadow:0 4px 16px rgba(8,80,65,0.18); border-bottom:3px solid var(--brand);
  }
  .logo-badge{width:44px;height:44px;border-radius:12px;background:#fff;flex-shrink:0;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.18);}
  .logo-badge img{width:100%;height:100%;object-fit:contain;padding:3px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.25;}
  .brand-text .title{font-size:16px;font-weight:700;}
  .brand-text .subtitle{font-size:11px;opacity:.85;}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 6px;max-width:900px;margin:0 auto;justify-content:center;}
  .tab{padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 10px rgba(15,110,86,0.25);}

  .container{max-width:760px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,40,33,0.04),0 6px 18px rgba(16,40,33,0.04);}
  .card h2{font-size:15px;font-weight:700;margin-bottom:14px;padding-bottom:12px;display:flex;align-items:center;gap:9px;color:var(--primary-dark);border-bottom:1px solid var(--border);}
  .card h2 i{font-size:16px;color:var(--brand);background:var(--brand-light);width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;}

  label{font-size:13px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px;}
  input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fcfdfc;color:var(--text);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:420px){.row2{grid-template-columns:1fr;}}

  .date-row{display:flex;gap:8px;align-items:center;}
  .date-row input{flex:1;font-size:16px;}
  .icon-btn{width:42px;height:42px;flex-shrink:0;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .date-label{margin-top:10px;font-size:14px;color:var(--primary-dark);font-weight:600;text-align:center;}
  .chip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--brand-light);color:var(--brand-dark);vertical-align:middle;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn.full{width:100%;justify-content:center;}
  .btn:active{transform:translateY(1px);}
  .total-box{background:var(--brand-light);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--brand-dark);}
  .total-box b{font-size:18px;}

  .entry{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
  .entry .main{flex:1;min-width:0;}
  .entry .top{display:flex;justify-content:space-between;gap:8px;font-weight:600;}
  .entry .meta{font-size:13px;color:var(--text-secondary);margin-top:4px;}
  .entry .amt{color:var(--primary-dark);white-space:nowrap;}
  .del{border:none;background:var(--danger-light);color:var(--danger);border-radius:8px;width:32px;height:32px;cursor:pointer;flex-shrink:0;}
  .empty{text-align:center;color:var(--text-secondary);font-size:14px;padding:16px 0;}
  .summary{display:flex;justify-content:space-between;font-size:14px;padding-top:10px;margin-top:6px;border-top:1px dashed var(--border);font-weight:600;}
  .pond-row{width:100%;text-align:left;border:1px solid var(--border);background:#fcfdfc;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:var(--text);display:flex;align-items:center;gap:10px;}
  .pond-row:hover{border-color:var(--primary);}
  .pond-row .pi{width:38px;height:38px;border-radius:10px;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .pond-row .pm{flex:1;min-width:0;}
  .pond-row .pname{font-weight:700;color:var(--primary-dark);}
  .pond-row .pmeta{font-size:12px;color:var(--text-secondary);margin-top:2px;}
  .pond-row .pr{text-align:right;font-size:14px;font-weight:600;white-space:nowrap;}
  .pond-row .pr small{display:block;font-size:11px;font-weight:500;color:var(--text-secondary);}
  .pond-row .chev{color:var(--text-secondary);font-size:18px;}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:4px;}
  .tag.ok{background:var(--primary-light);color:var(--primary-dark);}
  .tag.no{background:var(--brand-light);color:var(--brand-dark);}

  .sheet-bg{position:fixed;inset:0;background:rgba(16,40,33,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .sheet-bg.show{display:flex;}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;}
  @media (min-width:700px){.sheet-bg{align-items:center;}.sheet{border-radius:18px;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;border-bottom:3px solid var(--brand);}
  .sheet-head .icon-btn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff;}
  .sheet-title{font-size:17px;font-weight:700;}
  .sheet-sub{font-size:12px;opacity:.85;}
  .sheet-body{padding:14px 16px 20px;overflow-y:auto;}
  .sec-title{font-size:14px;font-weight:700;color:var(--primary-dark);margin:6px 0 10px;display:flex;align-items:center;gap:6px;}
  .sec-title i{color:var(--brand);}
  .sheet-body .entry{background:var(--card);}
  .btn.ghost{background:var(--card);color:var(--primary);border:1px dashed var(--primary);margin:4px 0 18px;}
  .net{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-size:14px;}
  .net div{display:flex;justify-content:space-between;padding:4px 0;}
  .net .big{border-top:1px dashed var(--border);margin-top:4px;padding-top:8px;font-size:16px;color:var(--primary-dark);}
  .net .big.neg{color:var(--danger);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-badge"><img src="logo.jpg" alt="โลโก้ชาญวิทย์ฟาร์ม"></div>
  <div class="brand-text">
    <span class="title">ชาญวิทย์ฟาร์ม</span>
    <span class="subtitle">ระบบบันทึกการประมูลกุ้ง</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active"><i class="ti ti-gavel"></i> ลงข้อมูลประมูล</button>
</div>

<div class="container">
  <!-- ส่วนที่ 1: เลือกวันที่ -->
  <div class="card">
    <h2><i class="ti ti-calendar"></i> วันที่ลงข้อมูล</h2>
    <div class="date-row">
      <button class="icon-btn" onclick="shiftDate(-1)" aria-label="วันก่อนหน้า"><i class="ti ti-chevron-left"></i></button>
      <input type="date" id="date" onchange="render()">
      <button class="icon-btn" onclick="shiftDate(1)" aria-label="วันถัดไป"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="date-label" id="dateLabel"></div>
  </div>

  <!-- ส่วนที่ 2: ลงข้อมูลการประมูล -->
  <div class="card">
    <h2><i class="ti ti-gavel"></i> ลงข้อมูลการประมูลกุ้ง</h2>
    <form id="form" onsubmit="addEntry(event)">
      <div class="row2">
        <div class="field"><label>บ่อ</label><input id="pond" placeholder="เช่น บ่อ 7" required></div>
        <div class="field"><label>ผู้ประมูล / แพ</label><input id="buyer" placeholder="ชื่อผู้ประมูล" required></div>
      </div>
      <div class="row2">
        <div class="field"><label>ขนาดกุ้ง (ตัว/กก.)</label><input id="size" type="number" inputmode="decimal" step="any" min="0" placeholder="เช่น 40"></div>
        <div class="field"><label>น้ำหนัก (กก.)</label><input id="weight" type="number" inputmode="decimal" step="any" min="0" placeholder="0" required oninput="calc()"></div>
      </div>
      <div class="field"><label>ราคาประมูล (บาท/กก.)</label><input id="price" type="number" inputmode="decimal" step="any" min="0" placeholder="0" required oninput="calc()"></div>
      <div class="total-box"><span>รวมเป็นเงิน</span><b id="total">0 บาท</b></div>
      <div class="field"><label>หมายเหตุ</label><textarea id="note" rows="2" placeholder="ถ้ามี"></textarea></div>
      <button class="btn full" type="submit"><i class="ti ti-device-floppy"></i> บันทึก</button>
    </form>
  </div>

  <!-- บ่อที่ประมูลในวันที่เลือก (กดเข้าไปดูรายละเอียด + ต้นทุน) -->
  <div class="card">
    <h2><i class="ti ti-list-details"></i> บ่อที่ประมูลวันนี้ <span id="count" class="chip">0</span></h2>
    <div id="list"></div>
  </div>
</div>

<!-- หน้ารายละเอียดบ่อ -->
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-head">
      <div><div class="sheet-title" id="sTitle"></div><div class="sheet-sub" id="sDate"></div></div>
      <button class="icon-btn" onclick="closeSheet()" aria-label="ปิด"><i class="ti ti-x"></i></button>
    </div>
    <div class="sheet-body">
      <div class="sec-title"><i class="ti ti-gavel"></i> รายการประมูล</div>
      <div id="sEntries"></div>
      <button class="btn ghost full" onclick="addForPond()"><i class="ti ti-plus"></i> เพิ่มรายการประมูลบ่อนี้</button>

      <div class="sec-title"><i class="ti ti-receipt"></i> ต้นทุน (บาท)</div>
      <div class="row2">
        <div class="field"><label>ค่ารถบรรทุกกุ้ง</label><input id="cTruck" type="number" inputmode="decimal" step="any" min="0" placeholder="0" oninput="calcNet()"></div>
        <div class="field"><label>ค่าชุดคัด</label><input id="cSort" type="number" inputmode="decimal" step="any" min="0" placeholder="0" oninput="calcNet()"></div>
      </div>
      <div class="row2">
        <div class="field"><label>ค่าน้ำแข็ง</label><input id="cIce" type="number" inputmode="decimal" step="any" min="0" placeholder="0" oninput="calcNet()"></div>
        <div class="field"><label>ค่าน้ำล้าง</label><input id="cWash" type="number" inputmode="decimal" step="any" min="0" placeholder="0" oninput="calcNet()"></div>
      </div>
      <div class="net">
        <div><span>ยอดขาย</span><b id="nRev">0</b></div>
        <div><span>ต้นทุนรวม</span><b id="nCost">0</b></div>
        <div class="big"><span>คงเหลือสุทธิ</span><b id="nNet">0</b></div>
      </div>
      <button class="btn full" id="saveCostBtn" onclick="saveCost()"><i class="ti ti-device-floppy"></i> บันทึกต้นทุน</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const col = db.collection('auctions');
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: 2});
  const costCol = db.collection('auction_costs');
  let items = [], costs = {}, unsub = null, unsubCost = null, openPond = null;

  function toISO(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
  function shiftDate(n){ const d = new Date($('date').value + 'T00:00'); d.setDate(d.getDate()+n); $('date').value = toISO(d); render(); }

  function calc(){ $('total').textContent = fmt(($('weight').value||0) * ($('price').value||0)) + ' บาท'; }

  async function addEntry(e){
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    try {
      await col.add({
        date: $('date').value,
        pond: $('pond').value.trim(), buyer: $('buyer').value.trim(),
        size: $('size').value ? Number($('size').value) : null,
        weight: Number($('weight').value), price: Number($('price').value),
        note: $('note').value.trim(),
        createdAt: Date.now()
      });
      ['size','weight','price','note'].forEach(id => $(id).value = '');
      calc(); toast('บันทึกแล้ว');
    } catch(err){ alert('บันทึกไม่สำเร็จ: ' + err.message); }
    btn.disabled = false;
  }

  async function delEntry(id){
    if(!confirm('ลบรายการนี้?')) return;
    try { await col.doc(id).delete(); toast('ลบแล้ว'); }
    catch(err){ alert('ลบไม่สำเร็จ: ' + err.message); }
  }

  // ฟังข้อมูลของวันที่เลือกแบบเรียลไทม์ (เปิดหลายเครื่องก็เห็นตรงกัน)
  function watch(){
    if(unsub) unsub();
    if(unsubCost) unsubCost();
    $('list').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    const date = $('date').value;
    unsub = col.where('date', '==', date).onSnapshot(snap => {
      items = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
      renderList(); if(openPond) renderSheet();
    }, err => { $('list').innerHTML = '<div class="empty">โหลดข้อมูลไม่ได้: ' + esc(err.message) + '</div>'; });
    unsubCost = costCol.where('date', '==', date).onSnapshot(snap => {
      costs = {}; snap.docs.forEach(d => { const c = d.data(); costs[c.pond] = c; });
      renderList();
    });
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function thaiDate(date){ return new Date(date + 'T00:00').toLocaleDateString('th-TH', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }

  function render(){
    const date = $('date').value;
    const isToday = date === toISO(new Date());
    $('dateLabel').innerHTML = thaiDate(date) + (isToday ? '<span class="chip">วันนี้</span>' : '');
    closeSheet();
    items = []; costs = {};
    watch();
  }

  // จัดกลุ่มรายการตามบ่อ (เรียงตามเลขบ่อ)
  function groupByPond(list){
    const g = {};
    list.forEach(x => (g[x.pond] = g[x.pond] || []).push(x));
    return Object.keys(g).sort((a,b) => a.localeCompare(b, 'th', {numeric:true})).map(p => ({pond:p, rows:g[p]}));
  }
  const revenue = rows => rows.reduce((s,x) => s + x.weight * x.price, 0);
  const costTotal = c => c ? (c.truck||0) + (c.sorting||0) + (c.ice||0) + (c.wash||0) : 0;

  function renderList(){
    const groups = groupByPond(items);
    $('count').textContent = groups.length;
    if(!groups.length){ $('list').innerHTML = '<div class="empty">ยังไม่มีบ่อที่ประมูลในวันนี้</div>'; return; }
    let W = 0, R = 0, C = 0;
    $('list').innerHTML = groups.map(g => {
      const w = g.rows.reduce((s,x) => s + x.weight, 0), r = revenue(g.rows), c = costTotal(costs[g.pond]);
      W += w; R += r; C += c;
      const tag = costs[g.pond] ? '<span class="tag ok">ลงต้นทุนแล้ว</span>' : '<span class="tag no">ยังไม่ลงต้นทุน</span>';
      return `<button class="pond-row" data-p="${esc(g.pond)}" onclick="openSheet(this.dataset.p)">
        <div class="pi"><i class="ti ti-ripple"></i></div>
        <div class="pm"><div class="pname">${esc(g.pond)} ${tag}</div>
          <div class="pmeta">${g.rows.length} รายการ · ${fmt(w)} กก. · ขาย ${fmt(r)} ฿</div></div>
        <div class="pr">${fmt(r - c)} ฿<small>สุทธิ</small></div>
        <i class="ti ti-chevron-right chev"></i></button>`;
    }).join('') + `<div class="summary"><span>รวม ${fmt(W)} กก.</span><span>สุทธิ ${fmt(R - C)} บาท</span></div>`;
  }

  // ===== หน้ารายละเอียดบ่อ =====
  function openSheet(p){
    openPond = p;
    const c = costs[p] || {};
    $('cTruck').value = c.truck || ''; $('cSort').value = c.sorting || '';
    $('cIce').value = c.ice || ''; $('cWash').value = c.wash || '';
    renderSheet();
    $('sheetBg').classList.add('show');
  }
  function closeSheet(){ openPond = null; $('sheetBg').classList.remove('show'); }

  function renderSheet(){
    const rows = items.filter(x => x.pond === openPond);
    $('sTitle').textContent = openPond;
    $('sDate').textContent = thaiDate($('date').value);
    $('sEntries').innerHTML = rows.length ? rows.map(x => `<div class="entry"><div class="main">
        <div class="top"><span>${esc(x.buyer)}</span><span class="amt">${fmt(x.weight * x.price)} ฿</span></div>
        <div class="meta">${x.size ? 'ขนาด ' + fmt(x.size) + ' ตัว/กก. · ' : ''}${fmt(x.weight)} กก. × ${fmt(x.price)} บาท</div>
        ${x.note ? `<div class="meta">${esc(x.note)}</div>` : ''}
      </div><button class="del" onclick="delEntry('${x.id}')" aria-label="ลบ"><i class="ti ti-trash"></i></button></div>`).join('')
      : '<div class="empty">ไม่มีรายการประมูล</div>';
    calcNet();
  }

  function readCost(){ return { truck: Number($('cTruck').value)||0, sorting: Number($('cSort').value)||0, ice: Number($('cIce').value)||0, wash: Number($('cWash').value)||0 }; }

  function calcNet(){
    const r = revenue(items.filter(x => x.pond === openPond)), c = costTotal(readCost()), n = r - c;
    $('nRev').textContent = fmt(r) + ' บาท';
    $('nCost').textContent = fmt(c) + ' บาท';
    $('nNet').textContent = fmt(n) + ' บาท';
    $('nNet').parentElement.classList.toggle('neg', n < 0);
  }

  async function saveCost(){
    const btn = $('saveCostBtn'); btn.disabled = true;
    const date = $('date').value;
    try {
      await costCol.doc(date + '__' + openPond.replace(/\//g, '-')).set({ date, pond: openPond, ...readCost(), updatedAt: Date.now() });
      toast('บันทึกต้นทุนแล้ว');
    } catch(err){ alert('บันทึกไม่สำเร็จ: ' + err.message); }
    btn.disabled = false;
  }

  function addForPond(){
    $('pond').value = openPond;
    closeSheet();
    $('form').scrollIntoView({behavior:'smooth', block:'start'});
    setTimeout(() => $('buyer').focus(), 300);
  }

  let tt;
  function toast(msg){ $('toast').textContent = msg; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 1500); }

  $('date').value = toISO(new Date());
  render();
</script>
</body>
</html>
